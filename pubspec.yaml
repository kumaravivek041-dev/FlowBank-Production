name: flowbank
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  auto_size_text: ^3.0.0
  image_picker: ^1.0.7
  encrypt: ^5.0.3
  flutter_slidable: ^3.0.0
  google_sign_in: ^6.1.1
  fl_chart: ^0.66.2
  plaid_flutter: ^3.0.0
  shimmer: ^3.0.0
  path_provider: ^2.1.2
  open_file: ^3.3.2
  excel: ^4.0.3
  pdf: ^3.10.8
  intl: ^0.20.2





  sentry_flutter: ^8.14.0
  lottie: ^3.1.0
  cupertino_icons: ^1.0.8
  dropdown_button2: ^2.3.9
  device_preview: ^1.2.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true
  assets:
    - assets/my_image.png
    - assets/my_image2.png
    - assets/my_image4.png
    - assets/my_image5.png
    - assets/my_image6.png
    - assets/my_image7.png
    - assets/my_image8.png
    - assets/visa.svg
    - assets/member-image.svg
    - assets/members-image.png
    - assets/members-image2.png
    - assets/fonts/
    - assets/financial-prediction-background.png
    - assets/bank-card.png
    - assets/goals-card.png
    - assets/ai-iocn-1.png
    - assets/ai-iocn-2.png
    - assets/ai-iocn-3.png
    - assets/background-gradient.png
    - assets/money-loading.json
    - assets/ai-loading.json
    - assets/FlowBank-icon.png


  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/FlowBank-icon.png"
